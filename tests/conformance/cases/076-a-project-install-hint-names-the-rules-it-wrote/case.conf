name: After a project install the next-steps line of each editor names the rules it wrote
# The counterpart of case 075: a project install writes each editor's rules and skills, and every
# installer says so in the same words (the CLI printed no line for these editors before).
run: install project cursor
run: install project windsurf
run: install project copilot
run: install project cline
run: install project antigravity
expect-exit: 0
expect-output: Cursor/Trae : qa-instinct rules always on
expect-output: Windsurf    : qa-instinct rules always on
expect-output: Copilot     : rules in .github
expect-output: Cline       : qa-instinct rules always on
expect-output: Antigravity : qa-instinct rules always on
expect-no-output: skills only (a global install writes no rules)
