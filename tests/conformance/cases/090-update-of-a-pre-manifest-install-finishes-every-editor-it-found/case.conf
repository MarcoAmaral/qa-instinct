name: Update of a pre-manifest install finishes every editor it found, not only the first
# Adopting the first editor's files writes the manifest (or, in install.ps1, its buffer). The second
# editor must still be adopted and finished, not skipped as unrecorded (plan 069).
seed-fixture: project:.claude/commands/qa.md = qa-v2.3.0.md
seed-package: project:.agents/skills/qa/SKILL.md = adapters/skills/qa/SKILL.md
run: update project all
expect-exit: 0
expect-same-as-package: project:.claude/skills/qa-reference/SKILL.md = .claude/skills/qa-reference/SKILL.md
expect-tree-as-package: project:.agents/skills = adapters/skills
expect-manifest: project antigravity .agents/skills/qa/SKILL.md
expect-manifest: project antigravity .agents/skills/qa-reference/SKILL.md
expect-absent: project:.cursor
