name: A file matching an earlier release is adopted silently, not backed up
# qa-v2.3.0.md is .claude/commands/qa.md exactly as release 2.3.0 shipped it; its hash is in
# .qa-instinct-known-hashes, so it is the package's own older file, not the user's.
seed-fixture: project:.claude/commands/qa.md = qa-v2.3.0.md
run: install project claude
expect-exit: 0
expect-no-backup: project:.claude/commands/qa.md
expect-same-as-package: project:.claude/commands/qa.md = .claude/commands/qa.md
expect-manifest: project claude .claude/commands/qa.md
