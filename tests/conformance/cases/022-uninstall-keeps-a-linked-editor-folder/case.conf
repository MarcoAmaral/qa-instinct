name: Uninstall keeps an editor folder that is a link, even when it leaves the folder empty
# .claude and .cursor are links into a dotfiles folder, as plan 033 item 1 allows. Uninstall
# removes the package's files through them and the folders it emptied inside them, but the links
# are the user's: removing one would break their dotfiles setup. rmdir on a link fails, so
# install.sh and the CLI keep them; install.ps1's empty-folder cleanup must not remove them either.
# Plan 047: Cursor's file is a rule file in .cursor/rules/.
seed-package: home:dotfiles/claude/rules/security-qa.md = .claude/rules/security-qa.md
seed-package: home:dotfiles/cursor/rules/qa-instinct.mdc = adapters/cursor/rules/qa-instinct.mdc
seed-symlink: project:.claude -> home:dotfiles/claude
seed-symlink: project:.cursor -> home:dotfiles/cursor
seed-manifest: project claude .claude/rules/security-qa.md
seed-manifest: project cursor .cursor/rules/qa-instinct.mdc
run: uninstall project claude
run: uninstall project cursor
expect-exit: 0
expect-absent: home:dotfiles/claude/rules/security-qa.md
expect-absent: home:dotfiles/cursor/rules/qa-instinct.mdc
expect-file: project:.claude
expect-file: project:.cursor
