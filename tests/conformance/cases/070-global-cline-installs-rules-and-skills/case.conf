name: A global install of Cline writes its rule files in ~/.cline/rules and the skills tree in ~/.cline/skills
# Plan 058. Cline documents global skills in "~/.cline/skills/" and says "Cline also searches
# ~/.cline/rules ... for global rules"; "Rules without frontmatter are always active". Nothing is
# written to ~/Documents/Cline/Rules, ~/.agents or a home .clinerules.
run: install global cline
expect-exit: 0
expect-tree-as-package: home:.cline/rules = adapters/cline/rules
expect-tree-as-package: home:.cline/skills = adapters/skills
expect-manifest: home cline .cline/rules/qa-instinct.md
expect-manifest: home cline .cline/rules/qa-instinct-testing-guidelines.md
expect-manifest: home cline .cline/skills/qa/SKILL.md
expect-absent: home:.clinerules
expect-absent: home:Documents/Cline
expect-absent: home:Cline/Rules
expect-absent: home:.agents
expect-no-output: only supports project-level install
