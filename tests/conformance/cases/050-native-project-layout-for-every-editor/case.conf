name: A project install of each non-Claude editor writes its rules and every skill where the editor documents them, and none of the old paths
# Plan 047. The always-on rules go to the editor's rules folder (Copilot's single file to
# .github/copilot-instructions.md), and the one Agent Skills tree to its skills folder, every file
# recorded under that editor. The merged adapters and plan 043's .bem-te-vi/ folder are not written.
run: install project cursor
run: install project windsurf
run: install project copilot
run: install project cline
run: install project antigravity
expect-exit: 0
expect-tree-as-package: project:.cursor/rules = adapters/cursor/rules
expect-tree-as-package: project:.cursor/skills = adapters/skills
expect-tree-as-package: project:.windsurf/rules = adapters/windsurf/rules
expect-tree-as-package: project:.windsurf/skills = adapters/skills
expect-tree-as-package: project:.github = adapters/copilot/rules
expect-tree-as-package: project:.github/skills = adapters/skills
expect-tree-as-package: project:.cline/rules = adapters/cline/rules
expect-tree-as-package: project:.cline/skills = adapters/skills
expect-tree-as-package: project:.agents/rules = adapters/antigravity/rules
expect-tree-as-package: project:.agents/skills = adapters/skills
expect-manifest: project cursor .cursor/rules/qa-instinct.mdc
expect-manifest: project cursor .cursor/rules/qa-instinct-testing-guidelines.mdc
expect-manifest: project cursor .cursor/skills/qa-cases/SKILL.md
expect-manifest: project cursor .cursor/skills/qa-reference/references/testing-design.md
expect-manifest: project windsurf .windsurf/rules/qa-instinct.md
expect-manifest: project windsurf .windsurf/skills/qa-groomer/SKILL.md
expect-manifest: project copilot .github/copilot-instructions.md
expect-manifest: project copilot .github/skills/qa-rules/references/security-qa.md
expect-manifest: project cline .cline/rules/qa-instinct-code-style-qa.md
expect-manifest: project cline .cline/skills/qa-plan/SKILL.md
expect-manifest: project antigravity .agents/rules/qa-instinct.md
expect-manifest: project antigravity .agents/skills/qa/SKILL.md
expect-absent: project:.cursor/rules/qa.mdc
expect-absent: project:.windsurfrules
expect-absent: project:.clinerules
expect-absent: project:.bem-te-vi
