name: Update moves an old project install of every non-Claude editor to the native layout
# The merged adapter at each old project path, as 4.0.1 installed it, and a plan 043 reference
# under .bem-te-vi/ (development installs have one), each recorded. Update removes and forgets
# every one the package no longer ships, adds every new file, and refreshes the two paths that
# stay (.github/copilot-instructions.md, .agents/skills/qa/SKILL.md). The text stands in for the
# old adapters: migration depends on paths and recorded hashes.
seed: project:.cursor/rules/qa.mdc = OLD CURSOR ADAPTER
seed-manifest: project cursor .cursor/rules/qa.mdc
seed: project:.bem-te-vi/cursor/qa-reference/references/testing-design.md = OLD REFERENCE
seed-manifest: project cursor .bem-te-vi/cursor/qa-reference/references/testing-design.md
seed: project:.windsurfrules = OLD WINDSURF ADAPTER
seed-manifest: project windsurf .windsurfrules
seed: project:.github/copilot-instructions.md = OLD COPILOT ADAPTER
seed-manifest: project copilot .github/copilot-instructions.md
seed: project:.clinerules = OLD CLINE ADAPTER
seed-manifest: project cline .clinerules
seed: project:.agents/skills/qa/SKILL.md = OLD ANTIGRAVITY ADAPTER
seed-manifest: project antigravity .agents/skills/qa/SKILL.md
run: update project all
expect-exit: 0
expect-absent: project:.cursor/rules/qa.mdc
expect-absent: project:.bem-te-vi
expect-absent: project:.windsurfrules
expect-absent: project:.clinerules
expect-no-manifest: project cursor .cursor/rules/qa.mdc
expect-no-manifest: project cursor .bem-te-vi/cursor/qa-reference/references/testing-design.md
expect-no-manifest: project windsurf .windsurfrules
expect-no-manifest: project cline .clinerules
expect-tree-as-package: project:.cursor/rules = adapters/cursor/rules
expect-tree-as-package: project:.cursor/skills = adapters/skills
expect-tree-as-package: project:.windsurf/rules = adapters/windsurf/rules
expect-tree-as-package: project:.windsurf/skills = adapters/skills
expect-tree-as-package: project:.github = adapters/copilot/rules
expect-tree-as-package: project:.github/skills = adapters/skills
expect-tree-as-package: project:.cline/rules = adapters/cline/rules
expect-tree-as-package: project:.cline/skills = adapters/skills
expect-tree-as-package: project:.agents/rules = adapters/antigravity/rules
expect-tree-as-package: project:.agents/skills = adapters/skills
expect-manifest: project copilot .github/copilot-instructions.md
expect-manifest: project antigravity .agents/skills/qa/SKILL.md
expect-manifest: project cline .cline/rules/qa-instinct.md
expect-absent: project:.claude
expect-output: Added
expect-output: no longer shipped
