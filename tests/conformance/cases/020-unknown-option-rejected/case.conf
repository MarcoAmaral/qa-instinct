name: An option the installer does not know is refused before anything is written
# A typo such as --globl must not fall back to a default and install somewhere the user did not
# ask for. install.ps1 refuses it through parameter binding, whose exit status is its own, so any
# failure counts.
run-unknown-option: install project claude
expect-exit-nonzero:
expect-absent: project:.claude
expect-absent: project:.qa-instinct-manifest
