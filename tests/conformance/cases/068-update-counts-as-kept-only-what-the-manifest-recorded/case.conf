name: Update counts a skipped destination as kept only when the manifest recorded it
# A folder stands where the package installs .cursor/rules/qa-instinct.mdc, so install skips it and
# records nothing for it. Update tries it again, as a file the install predates, and skips it
# again: it was never the package's, so it is not one of the "file(s) kept as-is". install.ps1
# and the CLI counted only recorded files; install.sh counted this one too (plan 053's outcome).
seed-dir: project:.cursor/rules/qa-instinct.mdc
run: install project cursor
run: update project cursor
expect-exit: 0
expect-file: project:.cursor/rules/qa-instinct.mdc
expect-no-manifest: project cursor .cursor/rules/qa-instinct.mdc
expect-manifest: project cursor .cursor/skills/qa/SKILL.md
expect-output: it is a directory
expect-no-output: kept as-is
