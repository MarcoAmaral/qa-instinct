name: Uninstalling one editor leaves another editor's files and manifest entries alone
# Plan 047: Cursor's and Cline's files are each editor's rules and skills folders.
run: install project claude
run: install project cursor
run: install project cline
run: uninstall project cursor
expect-exit: 0
expect-absent: project:.cursor
expect-no-manifest: project cursor .cursor/rules/qa-instinct.mdc
expect-no-manifest: project cursor .cursor/skills/qa/SKILL.md
expect-file: project:.claude/commands/qa.md
expect-file: project:.claude/rules/security-qa.md
expect-file: project:.cline/rules/qa-instinct.md
expect-file: project:.cline/skills/qa/SKILL.md
expect-file: project:.qa-instinct-manifest
expect-manifest: project claude .claude/commands/qa.md
expect-manifest: project cline .cline/rules/qa-instinct.md
expect-manifest: project cline .cline/skills/qa/SKILL.md
