name: A read-only adapter is kept on uninstall even when it is the manifest's last entry
# Uninstall drops the read-only file's entry along with every removed one, so the manifest ends
# empty and is deleted. The file must still be kept, not removed by a fallback that treats the
# missing manifest as an install made before manifests existed. Plan 047: a Cursor rule file.
run: install project cursor
expect-exit: 0
seed-readonly: project:.cursor/rules/qa-instinct.mdc
run: uninstall project cursor
expect-exit: 0
expect-same-as-package: project:.cursor/rules/qa-instinct.mdc = adapters/cursor/rules/qa-instinct.mdc
expect-absent: project:.qa-instinct-manifest
expect-output: read-only
