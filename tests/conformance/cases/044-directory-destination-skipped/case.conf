name: A destination that is a directory is skipped and said so; the rest installs and is recorded
# A project may already have a folder where the package installs a file: Cline documents its
# .clinerules/ as a folder of rule files, which is why this case was written; since plan 047 the
# folder stands at Copilot's .github/copilot-instructions.md instead. Writing into it, backing it
# up or replacing it would touch the user's files; failing on it would abort the run and leave the
# files installed before it unrecorded. The installer must skip it with one line saying so, record
# nothing for it, and install and record every other file and editor. `all` installs claude,
# cursor and windsurf before copilot and cline and antigravity after it.
seed: project:.github/copilot-instructions.md/01-mine.md = MY OWN COPILOT NOTES
run: install project all
expect-exit: 0
expect-content: project:.github/copilot-instructions.md/01-mine.md = MY OWN COPILOT NOTES
expect-absent: project:.github/copilot-instructions.md/copilot-instructions.md
expect-no-backup: project:.github/copilot-instructions.md
expect-no-manifest: project copilot .github/copilot-instructions.md
expect-manifest: project copilot .github/skills/qa/SKILL.md
expect-manifest: project claude .claude/commands/qa.md
expect-manifest: project cursor .cursor/rules/qa-instinct.mdc
expect-manifest: project antigravity .agents/skills/qa/SKILL.md
expect-file: project:.agents/skills/qa/SKILL.md
expect-output: is a directory
