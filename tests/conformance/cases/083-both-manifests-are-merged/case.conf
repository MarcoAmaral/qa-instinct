name: With a manifest under each name, every entry of both is kept and the old name is removed (plan 066)
# The old manifest holds the claude install; the new one holds one cursor entry. Uninstalling
# claude must find claude's files through the old manifest and keep the cursor entry.
run: install project claude
legacy-manifest: project
seed: project:.cursor/rules/mine.mdc = A CURSOR FILE RECORDED IN THE NEW MANIFEST
seed-manifest: project cursor .cursor/rules/mine.mdc
run: uninstall project claude
expect-exit: 0
expect-absent: project:.claude/commands/qa.md
expect-file: project:.cursor/rules/mine.mdc
expect-manifest: project cursor .cursor/rules/mine.mdc
expect-no-manifest: project claude .claude/commands/qa.md
expect-absent: project:.qa-skills-manifest
