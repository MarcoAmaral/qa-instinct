name: Uninstall never deletes through a symlinked folder below the editor's folder
# .claude/rules is a link to a folder outside the install tree that holds an exact copy of a
# package file, and the manifest records that file. Deleting it would delete through the link
# (after `qa-instinct link`, the package's own files). The file stays, its entry stays, and the
# installer says why. CLAUDE.md only creates the .claude folder the link is placed in.
seed: project:.claude/CLAUDE.md = THE PROJECT'S OWN NOTES
seed-package: home:outside/security-qa.md = .claude/rules/security-qa.md
seed-symlink: project:.claude/rules -> home:outside
seed-manifest: project claude .claude/rules/security-qa.md
run: uninstall project claude
expect-exit: 0
expect-same-as-package: home:outside/security-qa.md = .claude/rules/security-qa.md
expect-manifest: project claude .claude/rules/security-qa.md
expect-output: symbolic link
