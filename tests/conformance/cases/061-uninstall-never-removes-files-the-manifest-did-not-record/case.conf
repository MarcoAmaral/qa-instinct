name: Uninstall never removes a non-Claude editor's files that no manifest recorded, even byte-identical to the package
# Plan 047, review of #193. The universal adapter tells users to copy adapters/skills/ by hand,
# and those copies are byte-identical to the package. Uninstall removes only what the manifest
# recorded: with no manifest, a non-Claude editor has nothing to remove, since no release ever
# wrote these destinations without one (the no-manifest fallback stays for Claude Code, backed by
# .qa-skills-known-hashes). Whether a base had a manifest is decided once per run, before any
# editor is uninstalled, so an earlier editor emptying and deleting the manifest changes nothing.
# Project: only Cursor is recorded, the copies are not, and the .claude files are not either (the
# claude editor goes first in `all`, so they test the once-per-run decision without a red line).
# Home: no manifest at all.
seed-package: project:.agents/skills/qa/SKILL.md = adapters/skills/qa/SKILL.md
seed-package: project:.agents/skills/qa-cases/SKILL.md = adapters/skills/qa-cases/SKILL.md
seed-package: project:.agents/skills/qa-reference/references/testing-design.md = adapters/skills/qa-reference/references/testing-design.md
seed-package: project:.agents/rules/qa-instinct.md = adapters/antigravity/rules/qa-instinct.md
seed-package: project:.cline/skills/qa/SKILL.md = adapters/skills/qa/SKILL.md
seed-package: project:.claude/rules/security-qa.md = .claude/rules/security-qa.md
seed-package: project:.claude/commands/qa-cases.md = .claude/commands/qa-cases.md
run: install project cursor
run: uninstall project all
seed-package: home:.gemini/config/skills/qa/SKILL.md = adapters/skills/qa/SKILL.md
seed-package: home:.gemini/config/skills/qa-plan/SKILL.md = adapters/skills/qa-plan/SKILL.md
run: uninstall global antigravity
expect-exit: 0
expect-absent: project:.cursor
expect-absent: project:.qa-skills-manifest
expect-same-as-package: project:.agents/skills/qa/SKILL.md = adapters/skills/qa/SKILL.md
expect-same-as-package: project:.agents/skills/qa-cases/SKILL.md = adapters/skills/qa-cases/SKILL.md
expect-same-as-package: project:.agents/skills/qa-reference/references/testing-design.md = adapters/skills/qa-reference/references/testing-design.md
expect-same-as-package: project:.agents/rules/qa-instinct.md = adapters/antigravity/rules/qa-instinct.md
expect-same-as-package: project:.cline/skills/qa/SKILL.md = adapters/skills/qa/SKILL.md
expect-same-as-package: project:.claude/rules/security-qa.md = .claude/rules/security-qa.md
expect-same-as-package: project:.claude/commands/qa-cases.md = .claude/commands/qa-cases.md
expect-same-as-package: home:.gemini/config/skills/qa/SKILL.md = adapters/skills/qa/SKILL.md
expect-same-as-package: home:.gemini/config/skills/qa-plan/SKILL.md = adapters/skills/qa-plan/SKILL.md
