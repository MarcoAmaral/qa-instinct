name: Update keeps an old-location file the user changed, says what it means, and installs the new files anyway
# .windsurfrules was installed, then edited. It is the user's now: update keeps it, forgets it, and
# says that Windsurf still loads it in every conversation, then installs the native layout.
seed: project:.windsurfrules = OLD WINDSURF ADAPTER
seed-manifest: project windsurf .windsurfrules
seed: project:.windsurfrules = MY OWN WINDSURF RULES
run: update project windsurf
expect-exit: 0
expect-content: project:.windsurfrules = MY OWN WINDSURF RULES
expect-no-manifest: project windsurf .windsurfrules
expect-tree-as-package: project:.windsurf/rules = adapters/windsurf/rules
expect-tree-as-package: project:.windsurf/skills = adapters/skills
expect-manifest: project windsurf .windsurf/rules/qa-instinct.md
expect-output: changed since it was installed
expect-output: Windsurf still loads .windsurfrules
