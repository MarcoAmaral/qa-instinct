name: A tampered manifest cannot make uninstall reach outside the install tree
# .qa-instinct-manifest is committed into consuming repositories, so its paths are untrusted. The
# entry climbs out of the project with ../ and carries the victim's real hash, so a hash check
# alone would not save it. Every installer deleted the victim before 2.6.1.
seed: home:victim.txt = A FILE OUTSIDE THE INSTALL TREE
seed-manifest: project claude ../home/victim.txt
run: uninstall project claude
expect-content: home:victim.txt = A FILE OUTSIDE THE INSTALL TREE
expect-output: Refusing
