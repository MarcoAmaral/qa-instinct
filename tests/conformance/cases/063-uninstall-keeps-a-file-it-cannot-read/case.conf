name: Uninstall keeps a file it cannot read, says why, and removes the rest
# A file that cannot be read cannot be hashed, so nothing proves it is still the package's: it is
# kept, like a read-only one, and a recorded one has its entry dropped. The reason given must be
# the real one, not "changed", and the run must not stop on it. The project install is recorded in
# a manifest; the home one predates manifests, so uninstall falls back to comparing each package
# file with its copy. Plan 053 I15.
run: install project cursor
seed-unreadable: project:.cursor/rules/qa-instinct.mdc
seed-package: home:.claude/rules/security-qa.md = .claude/rules/security-qa.md
seed-package: home:.claude/rules/test-tools.md = .claude/rules/test-tools.md
seed-unreadable: home:.claude/rules/security-qa.md
run: uninstall project cursor
run: uninstall global claude
expect-exit: 0
expect-file: project:.cursor/rules/qa-instinct.mdc
expect-absent: project:.cursor/skills/qa/SKILL.md
expect-absent: project:.qa-instinct-manifest
expect-file: home:.claude/rules/security-qa.md
expect-absent: home:.claude/rules/test-tools.md
expect-output: Kept .cursor/rules/qa-instinct.mdc
expect-output: destination cannot be read
expect-no-output: changed since
