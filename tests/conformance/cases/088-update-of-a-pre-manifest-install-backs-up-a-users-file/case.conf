name: Update of a pre-manifest install backs up a user's file at a package path, in the same run
# Adoption leaves a file with no known hash alone. The rest of the run then meets it the way init
# and any later update do: it is backed up, then replaced (plan 033 item 3, plan 069).
seed-fixture: project:.claude/commands/qa.md = qa-v2.3.0.md
seed: project:.claude/rules/security-qa.md = MY OWN SECURITY POLICY
run: update project claude
expect-exit: 0
expect-backup-content: project:.claude/rules/security-qa.md = MY OWN SECURITY POLICY
expect-same-as-package: project:.claude/rules/security-qa.md = .claude/rules/security-qa.md
expect-manifest: project claude .claude/rules/security-qa.md
