name: An update finds a 4.x install by its old manifest name and moves the manifest to the new name (plan 066)
# A 4.x release recorded its install in .qa-skills-manifest. legacy-manifest stands in for one.
run: install project claude
legacy-manifest: project
run: update project claude
expect-exit: 0
expect-absent: project:.qa-skills-manifest
expect-file: project:.qa-instinct-manifest
expect-manifest: project claude .claude/commands/qa.md
expect-manifest: project claude .claude/rules/security-qa.md
expect-no-backup: project:.claude/rules/security-qa.md
