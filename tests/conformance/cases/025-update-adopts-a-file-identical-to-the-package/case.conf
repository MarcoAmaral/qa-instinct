name: Update with no manifest adopts a file identical to the package's current one
# These two files stand for an install made before manifests existed, written by a package
# build whose files are not in .qa-instinct-known-hashes (that list holds tagged releases only).
# A file byte-identical to the one being installed is the package's own, exactly as the
# install path already treats it, so update adopts it and records it in the manifest, which is
# what lets a later uninstall remove everything (plan 033, 2026-10-18).
seed-package: project:.claude/commands/qa.md = .claude/commands/qa.md
seed-package: project:.claude/rules/test-tools.md = .claude/rules/test-tools.md
run: update project claude
expect-exit: 0
expect-manifest: project claude .claude/commands/qa.md
expect-manifest: project claude .claude/rules/test-tools.md
expect-no-backup: project:.claude/commands/qa.md
expect-output: Adopted
