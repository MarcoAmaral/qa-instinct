name: An editor none of whose files was written is not reported as installed
# Every destination is skipped: four Claude Code folders and both Cursor folders are links
# (qa-instinct link, or folders shared with another tool), and the two hooks in .claude/hooks are
# read-only copies. Nothing is written or recorded, and no installer may print its success line
# for either editor: "scaffolded ..." (install.sh, install.ps1) or "✓ hooks/" (the CLI) for Claude
# Code, ".cursor/rules/ and .cursor/skills/" (all three) for Cursor. Plan 053 I14.
seed-dir: home:shared/claude-commands
seed-dir: home:shared/claude-rules
seed-dir: home:shared/claude-skills
seed-dir: home:shared/claude-agents
seed-dir: home:shared/cursor-rules
seed-dir: home:shared/cursor-skills
seed-dir: project:.claude
seed-dir: project:.cursor
seed-symlink: project:.claude/commands -> home:shared/claude-commands
seed-symlink: project:.claude/rules -> home:shared/claude-rules
seed-symlink: project:.claude/skills -> home:shared/claude-skills
seed-symlink: project:.claude/agents -> home:shared/claude-agents
seed-symlink: project:.cursor/rules -> home:shared/cursor-rules
seed-symlink: project:.cursor/skills -> home:shared/cursor-skills
seed-package: project:.claude/hooks/check-test-evidence.sh = .claude/hooks/check-test-evidence.sh
seed-package: project:.claude/hooks/validate-tc-format.sh = .claude/hooks/validate-tc-format.sh
seed-readonly: project:.claude/hooks/check-test-evidence.sh
seed-readonly: project:.claude/hooks/validate-tc-format.sh
run: install project claude
run: install project cursor
expect-exit: 0
expect-absent: home:shared/claude-rules/security-qa.md
expect-absent: home:shared/cursor-skills/qa
expect-absent: project:.qa-skills-manifest
expect-output: symbolic link
expect-no-output: scaffolded
expect-no-output: ✓ hooks/
expect-no-output: .cursor/rules/ and .cursor/skills/
