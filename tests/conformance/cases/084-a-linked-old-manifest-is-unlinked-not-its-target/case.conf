name: An old manifest that is a symlink is read, then the link is removed and its target kept (plan 066)
run: install project claude
legacy-manifest: project -> home:elsewhere/old-manifest
run: update project claude
expect-exit: 0
expect-absent: project:.qa-skills-manifest
expect-file: home:elsewhere/old-manifest
expect-manifest: project claude .claude/commands/qa.md
expect-no-backup: project:.claude/commands/qa.md
