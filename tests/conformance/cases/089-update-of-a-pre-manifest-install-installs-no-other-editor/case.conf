name: Update of a pre-manifest install finishes only the editors it found
# An editor with no adopted file is not installed, so nothing is written for it, whichever editors
# the run names (plan 013, plan 069). Finishing the install is per editor, not per run.
seed-fixture: project:.claude/commands/qa.md = qa-v2.3.0.md
run: update project all
expect-exit: 0
expect-same-as-package: project:.claude/skills/qa-reference/SKILL.md = .claude/skills/qa-reference/SKILL.md
expect-absent: project:.cursor
expect-absent: project:.windsurf
expect-absent: project:.github
expect-absent: project:.cline
expect-absent: project:.agents
