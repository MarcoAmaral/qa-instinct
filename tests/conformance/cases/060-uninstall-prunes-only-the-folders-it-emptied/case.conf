name: Uninstall removes only the folders its own removals emptied; a user's own empty folders survive
# Since plan 047 the non-Claude editors install into folders a project may already have (.github/,
# .agents/, .cline/, .windsurf/, .cursor/). Uninstall removes a folder only when removing one of
# the package's recorded files left it empty, and then the package's own folders of an editor it
# actually uninstalled: never a folder of an editor with nothing recorded, never a level it did not
# empty, and never one below a level that does not exist. Project: only Cursor is installed. Home:
# nothing is installed, and the user's empty folders sit where Cursor and Antigravity install.
seed-dir: project:.github/skills
seed-dir: project:.github/workflows-empty
seed-dir: project:.agents/rules
seed-dir: project:.cline/rules
seed-dir: project:.windsurf/rules
seed-dir: project:.cursor/my-notes
seed-dir: home:.cursor/skills/qa-cases
seed-dir: home:.gemini/config/skills
run: install project cursor
run: uninstall project all
expect-exit: 0
expect-file: project:.github/skills
expect-file: project:.github/workflows-empty
expect-file: project:.agents/rules
expect-file: project:.cline/rules
expect-file: project:.windsurf/rules
expect-file: project:.cursor/my-notes
expect-absent: project:.cursor/rules
expect-absent: project:.cursor/skills
expect-absent: project:.qa-instinct-manifest
run: uninstall global all
expect-exit: 0
expect-file: home:.cursor/skills/qa-cases
expect-file: home:.gemini/config/skills
