name: A linked .agents/skills folder is never written through; the install says so and installs the rest
# Sharing one skills folder between tools by linking .agents/skills is common. The link leads
# outside the install tree, so nothing is written or deleted through it (plan 033 item 1): the
# file recorded inside it stays as it is and stays recorded, and the rules are still installed.
seed: home:shared-skills/qa/SKILL.md = SHARED SKILL
seed-dir: project:.agents
seed-symlink: project:.agents/skills -> home:shared-skills
seed-manifest: project antigravity .agents/skills/qa/SKILL.md
run: install project antigravity
run: update project antigravity
expect-exit: 0
expect-content: home:shared-skills/qa/SKILL.md = SHARED SKILL
expect-absent: home:shared-skills/qa-cases
expect-manifest: project antigravity .agents/skills/qa/SKILL.md
expect-tree-as-package: project:.agents/rules = adapters/antigravity/rules
expect-manifest: project antigravity .agents/rules/qa-instinct.md
expect-output: symbolic link
