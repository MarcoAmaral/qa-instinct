name: A CRLF copy of a file an earlier release shipped is adopted silently, not backed up
# qa-v2.3.0-crlf.md is .claude/commands/qa.md exactly as release 2.3.0 shipped it, with every
# line ending converted to CRLF, as a Windows checkout with core.autocrlf=true leaves it. It
# differs from a hash in .qa-instinct-known-hashes only in carriage returns, so it is the package's
# own older file, not the user's (plan 017).
seed-fixture: project:.claude/commands/qa.md = qa-v2.3.0-crlf.md
run: install project claude
expect-exit: 0
expect-no-backup: project:.claude/commands/qa.md
expect-same-as-package: project:.claude/commands/qa.md = .claude/commands/qa.md
expect-manifest: project claude .claude/commands/qa.md
