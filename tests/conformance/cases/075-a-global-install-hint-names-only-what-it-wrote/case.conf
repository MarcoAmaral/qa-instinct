name: After a global install the next-steps line of each editor names only what a global install wrote
# Plan 058, "Findings outside scope": a global install of Cursor, Windsurf, Copilot or Antigravity
# writes skills only, yet install.sh and install.ps1 said "qa-instinct rules always on" (and, for
# Copilot, ".github/copilot-instructions.md"), and the CLI printed no line for these editors.
# Cline writes ~/.cline/rules as well, so its line keeps the rules.
run: install global cursor
run: install global windsurf
run: install global copilot
run: install global cline
run: install global antigravity
expect-exit: 0
expect-output: Cursor/Trae : skills only (a global install writes no rules)
expect-output: Windsurf    : skills only (a global install writes no rules)
expect-output: Copilot     : skills only (a global install writes no rules)
expect-output: Cline       : qa-instinct rules always on
expect-output: Antigravity : skills only (a global install writes no rules)
expect-no-output: Cursor/Trae : qa-instinct rules always on
expect-no-output: Windsurf    : qa-instinct rules always on
expect-no-output: Antigravity : qa-instinct rules always on
expect-no-output: copilot-instructions.md
