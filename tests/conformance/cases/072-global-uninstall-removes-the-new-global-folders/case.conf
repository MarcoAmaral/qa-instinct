name: A global uninstall removes Copilot's, Cline's and the Antigravity CLI's global files and the folders it emptied
# Plan 058. Uninstall follows the manifest and removes the folders its own removals emptied, up to
# the home folder. ~/.copilot holds a file of Copilot's own, so it stays; the rest goes. The
# expectations are read after the last run, so the installs are checked by what they printed.
seed: home:.copilot/config.json = COPILOT OWN CONFIG
run: install global copilot
run: install global cline
run: install global antigravity
run: uninstall global copilot
run: uninstall global cline
run: uninstall global antigravity
expect-exit: 0
expect-content: home:.copilot/config.json = COPILOT OWN CONFIG
expect-absent: home:.copilot/skills
expect-absent: home:.cline
expect-absent: home:.gemini
expect-absent: home:.qa-instinct-manifest
expect-output: .copilot/skills/
expect-output: .cline/rules/ and .cline/skills/
expect-output: .gemini/config/skills/ and .gemini/antigravity-cli/skills/
