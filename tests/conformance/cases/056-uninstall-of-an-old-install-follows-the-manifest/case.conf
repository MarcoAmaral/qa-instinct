name: Uninstall of an install that was never updated removes every recorded file and the folders it empties, wherever they are
# Uninstall follows the manifest, not the current editor map: the old project paths and a plan 043
# reference are all recorded, so all go, and so do the folders they leave empty. The reference's
# skill folder (retired-skill) is not one the package ships today, so only the manifest can lead
# uninstall to it and to its folders.
seed: project:.cursor/rules/qa.mdc = OLD CURSOR ADAPTER
seed-manifest: project cursor .cursor/rules/qa.mdc
seed: project:.bem-te-vi/cursor/retired-skill/references/old.md = OLD REFERENCE
seed-manifest: project cursor .bem-te-vi/cursor/retired-skill/references/old.md
seed: project:.windsurfrules = OLD WINDSURF ADAPTER
seed-manifest: project windsurf .windsurfrules
seed: project:.github/copilot-instructions.md = OLD COPILOT ADAPTER
seed-manifest: project copilot .github/copilot-instructions.md
seed: project:.clinerules = OLD CLINE ADAPTER
seed-manifest: project cline .clinerules
seed: project:.agents/skills/qa/SKILL.md = OLD ANTIGRAVITY ADAPTER
seed-manifest: project antigravity .agents/skills/qa/SKILL.md
run: uninstall project all
expect-exit: 0
expect-absent: project:.cursor
expect-absent: project:.bem-te-vi
expect-absent: project:.windsurfrules
expect-absent: project:.github
expect-absent: project:.clinerules
expect-absent: project:.agents
expect-absent: project:.qa-instinct-manifest
