name: Update of a pre-manifest install adds what the release ships, in one run
# qa-v2.3.0.md stands for an install made before manifests (2.3.3). The file is adopted and refreshed
# by hash, and the editor it proves installed is finished in the same run: a second update must not
# be needed (plan 069). The rules tree stands for everything the old install lacks.
seed-fixture: project:.claude/commands/qa.md = qa-v2.3.0.md
run: update project claude
expect-exit: 0
expect-output: Adopted
expect-no-backup: project:.claude/commands/qa.md
expect-same-as-package: project:.claude/commands/qa.md = .claude/commands/qa.md
expect-same-as-package: project:.claude/skills/qa-reference/SKILL.md = .claude/skills/qa-reference/SKILL.md
expect-tree-as-package: project:.claude/rules = .claude/rules
expect-manifest: project claude .claude/commands/qa.md
expect-manifest: project claude .claude/skills/qa-reference/SKILL.md
expect-manifest: project claude .claude/rules/test-tools.md
