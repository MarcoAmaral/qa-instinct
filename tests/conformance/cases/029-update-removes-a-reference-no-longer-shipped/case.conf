name: Update removes a non-Claude reference the package stopped shipping, and drops its entry
# retired-reference.md stands for a reference an earlier release installed in the Cursor skills
# folder and this one no longer ships. A non-Claude entry is shipped only when this install writes
# its path (plan 047), or it is kept forever.
run: install project cursor
seed: project:.cursor/skills/qa-reference/references/retired-reference.md = RETIRED REFERENCE
seed-manifest: project cursor .cursor/skills/qa-reference/references/retired-reference.md
run: update project cursor
expect-exit: 0
expect-absent: project:.cursor/skills/qa-reference/references/retired-reference.md
expect-no-manifest: project cursor .cursor/skills/qa-reference/references/retired-reference.md
expect-file: project:.cursor/rules/qa-instinct.mdc
expect-output: no longer shipped
