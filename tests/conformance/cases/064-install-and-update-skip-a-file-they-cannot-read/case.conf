name: Install and update skip a destination they cannot read, and update keeps an unreadable file it no longer ships
# An unreadable destination can be neither hashed nor backed up, so it is left as it is and the
# rest installs; its entry stays as it was. A recorded file the package stopped shipping that
# cannot be read is kept, its entry dropped, for that reason and not as "changed". The home
# install predates manifests: update adopts only what it can prove is the package's, so the
# unreadable file is left alone and unrecorded. Plan 053 I15.
run: install project cursor
seed: project:.cursor/rules/retired.mdc = A RULE AN OLDER RELEASE SHIPPED
seed-manifest: project cursor .cursor/rules/retired.mdc
seed-unreadable: project:.cursor/rules/retired.mdc
seed-unreadable: project:.cursor/rules/qa-instinct.mdc
seed-package: home:.claude/rules/security-qa.md = .claude/rules/security-qa.md
seed-package: home:.claude/rules/test-tools.md = .claude/rules/test-tools.md
seed-unreadable: home:.claude/rules/security-qa.md
run: install project cursor
run: update project cursor
run: update global claude
expect-exit: 0
expect-file: project:.cursor/rules/qa-instinct.mdc
expect-file: project:.cursor/rules/retired.mdc
expect-no-backup: project:.cursor/rules/qa-instinct.mdc
expect-manifest: project cursor .cursor/rules/qa-instinct.mdc
expect-manifest: project cursor .cursor/skills/qa/SKILL.md
expect-no-manifest: project cursor .cursor/rules/retired.mdc
expect-file: home:.claude/rules/security-qa.md
expect-no-backup: home:.claude/rules/security-qa.md
expect-no-manifest: home claude .claude/rules/security-qa.md
expect-manifest: home claude .claude/rules/test-tools.md
expect-output: Skipped .cursor/rules/qa-instinct.mdc
expect-output: Kept .cursor/rules/retired.mdc
expect-output: destination cannot be read
expect-no-output: changed since
expect-no-output: backed up
