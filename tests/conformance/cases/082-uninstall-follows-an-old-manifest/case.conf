name: Uninstall of a 4.x install follows its old manifest, keeps an edited file, and leaves no manifest under either name (plan 066)
run: install project claude
seed: project:.claude/rules/testing-guidelines.md = I EDITED THIS AFTER INSTALLING
legacy-manifest: project
run: uninstall project claude
expect-exit: 0
expect-absent: project:.claude/commands/qa.md
expect-absent: project:.claude/rules/security-qa.md
expect-content: project:.claude/rules/testing-guidelines.md = I EDITED THIS AFTER INSTALLING
expect-absent: project:.qa-skills-manifest
expect-absent: project:.qa-instinct-manifest
